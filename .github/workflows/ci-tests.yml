name: Pruebas y cobertura

# Ejecuta la suite de Jest y genera coverage/lcov.info (lo consume SonarQube).
# No despliega nada: el deploy sigue en deploy.yml.
on:
  push:
    branches: [fase-3, main]
  pull_request:
    branches: [fase-3, main]

permissions:
  contents: read

jobs:
  test:
    name: Jest + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Instalar dependencias (raíz + backend)
        run: |
          npm ci
          npm ci --prefix backend
      - name: Pruebas con cobertura
        run: npm run test:coverage
      - name: Publicar lcov como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

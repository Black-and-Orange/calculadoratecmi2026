# Configuración de análisis SonarQube (todo el repo como un solo proyecto).
sonar.projectKey=calculadora-tecmi
sonar.projectName=Calculadora Tecmilenio
sonar.sourceEncoding=UTF-8

# Código a analizar
sonar.sources=backend,frontend,admin
# Pruebas (mismos directorios; se distinguen por inclusión)
sonar.tests=backend,frontend,admin
sonar.test.inclusions=**/__tests__/**

# Fuera del análisis: dependencias, scratch de trabajo, evidencia QA (Playwright),
# migraciones SQL de un solo uso, minificados, docs y reportes.
sonar.exclusions=**/node_modules/**,.context/**,qa-evidencia/**,backend/migrations/**,**/*.min.js,docs/**,coverage/**,**/__tests__/**

# Cobertura generada por `npm run test:coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info

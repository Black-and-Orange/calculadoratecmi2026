<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <head rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/panel.css">
</head>

<body>
    <div class="container mt-4">
        <ul class="nav nav-tabs" id="myTab" role="tablist"></ul>
        <div class="tab-content" id="myTabContent"></div>
    </div>

    <script type="module">
        import { niveles } from './js/control/tabs.js';
    
        const createTabContent = (nivel, pestaña) => {
            
            switch (pestaña.id) {
                case 'campus':
                    return `
                        <div class="tab-pane fade show active" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadCampusNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="campusNivel${nivel.id}"></div>
                            <form id="createCampusNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="campusNivel${nivel.id}Name" placeholder="Nombre del ${pestaña.nombre}" required>
                                <input type="text" class="form-control" id="campusNivel${nivel.id}Category" placeholder="Categoría del ${pestaña.nombre}" required>
                                <button type="submit" class="btn btn-success">Crear ${pestaña.nombre}</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;
                
                case 'programas':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadPlanesNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="planesNivel${nivel.id}"></div>
                            <form id="createPlanesNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="planesNivel${nivel.id}Name" placeholder="Nombre del programa" required>
                                <input type="text" class="form-control" id="planesNivel${nivel.id}Type" placeholder="Tipo de programa" required>
                                <button type="submit" class="btn btn-success">Crear programa</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;
                
                case 'periodo':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadPeriodoNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="periodoNivel${nivel.id}"></div>
                            <form id="createPeriodoNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="periodoNivel${nivel.id}Name" placeholder="Periodo" required>
                                <input type="text" class="form-control" id="periodoNivel${nivel.id}Type" placeholder="Código" required>
                                <button type="submit" class="btn btn-success">Crear periodo</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;
                
                case 'seguros':
                return `
                    <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                        <button id="loadSegurosNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                        <div id="segurosNivel${nivel.id}"></div>
                        <form id="createSegurosNivel${nivel.id}Form">
                            <input type="text" class="form-control" id="segurosNivel${nivel.id}Accidentes" placeholder="Seguro Accidentes" required>
                            <input type="text" class="form-control" id="segurosNivel${nivel.id}Cobertura" placeholder="Cobertura VIVE" required>
                            <input type="text" class="form-control" id="segurosNivel${nivel.id}Estudiantil" placeholder="Seguro Estudiantil" required>
                            <button type="submit" class="btn btn-success">Crear Seguro</button>
                        </form>
                        <div class="mt-2 action-icons">
                            <i class="fas fa-edit" title="Editar"></i>
                            <i class="fas fa-trash-alt" title="Eliminar"></i>
                        </div>
                    </div>`;

                
                case 'becas':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadBecasNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="becasNivel${nivel.id}"></div>
                            <form id="createBecasNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="becasNivel${nivel.id}Tipo" placeholder="Tipo" required>
                                <input type="text" class="form-control" id="becasNivel${nivel.id}PorcMinimo" placeholder="Porcentaje Minimo" required>
                                <input type="text" class="form-control" id="becasNivel${nivel.id}PorcMaximo" placeholder="Porcentaje Maximo" required>
                                <input type="text" class="form-control" id="becasNivel${nivel.id}PromMinimo" placeholder="Promedio Minimo" required>
                                <input type="text" class="form-control" id="becasNivel${nivel.id}PromMaximo" placeholder="Promedio Maximo" required>
                                <button type="submit" class="btn btn-success">Crear Beca</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;
                
                case 'apoyos':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadApoyosNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="apoyosNivel${nivel.id}"></div>
                            <form id="createApoyosNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="apoyosNivel${nivel.id}Porcentaje" placeholder="Porcentaje de apoyo estudiantil" required>
                                <button type="submit" class="btn btn-success">Crear apoyo estudiantil</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;

                case 'interes':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadInteresNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="interesNivel${nivel.id}"></div>
                            <form id="createInteresNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="interesNivel${nivel.id}Interes" placeholder="Porcentaje de interes" required>
                                <button type="submit" class="btn btn-success">Crear apoyo estudiantil</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;
                
                case 'carga-materias':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadMateriasNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="materiasNivel${nivel.id}"></div>
                            <form id="createMateriasNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="materiasNivel${nivel.id}Materias" placeholder="Número de materias" required>
                                <button type="submit" class="btn btn-success">Crear materia</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;

                case 'certificados':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadCertificadosNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="certificadosNivel${nivel.id}"></div>
                            <form id="createCertificadosNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="certificadosNivel${nivel.id}Certificados" placeholder="Número de certificados" required>
                                <button type="submit" class="btn btn-success">Crear certificado</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;

                case 'ingles':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadInglesNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="inglesNivel${nivel.id}"></div>
                            <form id="createInglesNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="inglesNivel${nivel.id}Ingles" placeholder="Número de ingles" required>
                                <button type="submit" class="btn btn-success">Crear cursos de ingles</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;

                case 'semanas':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadSemanasNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="semanasNivel${nivel.id}"></div>
                            <form id="createSemanasNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="semanasNivel${nivel.id}Semanas" placeholder="Número de semanas" required>
                                <button type="submit" class="btn btn-success">Crear semanas SEDI</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;

                case 'carga-creditos':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadCreditosNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="creditosNivel${nivel.id}"></div>
                            <form id="createCreditosNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="creditosNivel${nivel.id}Name" placeholder="Número de créditos" required>
                                <button type="submit" class="btn btn-success">Crear Crédito</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;
                
                case 'costo-materias':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadCostosNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="costosNivel${nivel.id}"></div>
                            <form id="createCostosNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="costosNivel${nivel.id}Name" placeholder="Clave" required>
                                <input type="text" class="form-control" id="costosNivel${nivel.id}Type" placeholder="Costo" required>
                                <button type="submit" class="btn btn-success">Crear Costo</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;
                
                case 'beneficios':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadBeneficiosNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="beneficiosNivel${nivel.id}"></div>
                            <form id="createBeneficiosNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="beneficiosNivel${nivel.id}Name" placeholder="Nombre del beneficio" required>
                                <input type="text" class="form-control" id="beneficiosNivel${nivel.id}Descripcion" placeholder="Descripción" required>
                                <input type="text" class="form-control" id="beneficiosNivel${nivel.id}Icono" placeholder="Link del icono" required>
                                <button type="submit" class="btn btn-success">Crear Beneficio</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;

                case 'formato':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadFormatoNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="formatoNivel${nivel.id}"></div>
                            <form id="createFormatoNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="formatoNivel${nivel.id}Formato" placeholder="Formato" required>
                                <input type="text" class="form-control" id="formatoNivel${nivel.id}Codigo" placeholder="Código" required>
                                <button type="submit" class="btn btn-success">Crear formato</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;

                case 'formato_asociado':
                    return `
                        <div class="tab-pane fade" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                            <button id="loadFormatoAsociadoNivel${nivel.id}" class="btn btn-primary">Cargar ${pestaña.nombre}</button>
                            <div id="formatoNivel${nivel.id}"></div>
                            <form id="createFormatoAsociadoNivel${nivel.id}Form">
                                <input type="text" class="form-control" id="formatoNivel${nivel.id}FormatoAsociado" placeholder="Formato" required>
                                <input type="text" class="form-control" id="formatoNivel${nivel.id}Costo" placeholder="Costo" required>
                                <button type="submit" class="btn btn-success">Crear formato</button>
                            </form>
                            <div class="mt-2 action-icons">
                                <i class="fas fa-edit" title="Editar"></i>
                                <i class="fas fa-trash-alt" title="Eliminar"></i>
                            </div>
                        </div>`;
                
                default:
                    return ''; // Si el id de la pestaña no coincide, devuelve contenido vacío.
            }
        };
    
        const createTabs = () => {
            let tabs = '';
            let tabContent = '';
    
            niveles.forEach((nivel, nivelIndex) => {
                // Crear la pestaña del nivel (tab principal)
                tabs += `
                <li class="nav-item">
                    <a class="nav-link ${nivelIndex === 0 ? 'active' : ''}" id="${nivel.id}-tab" data-toggle="tab" href="#nivel-${nivel.id}" role="tab" aria-controls="nivel-${nivel.id}">${nivel.nombre}</a>
                </li>`;
    
                // Crear el contenedor del nivel y los tabs secundarios
                tabContent += `
                <div class="tab-pane fade ${nivelIndex === 0 ? 'show active' : ''}" id="nivel-${nivel.id}" role="tabpanel" aria-labelledby="${nivel.id}-tab">
                    <ul class="nav nav-pills mb-3" id="pills-tab-${nivel.id}" role="tablist">
                        ${nivel.pestañas.map((pestaña, pestañaIndex) => `
                            <li class="nav-item">
                                <a class="nav-link ${pestañaIndex === 0 ? 'active' : ''}" id="${pestaña.id}-${nivel.id}-tab" data-toggle="pill" href="#${pestaña.id}-${nivel.id}" role="tab" aria-controls="${pestaña.id}-${nivel.id}">
                                    ${pestaña.nombre}
                                </a>
                            </li>`).join('')}
                    </ul>
                    <div class="tab-content" id="pills-tabContent-${nivel.id}">
                        ${nivel.pestañas.map((pestaña, pestañaIndex) => createTabContent(nivel, pestaña)).join('')}
                    </div>
                </div>`;
            });
    
            document.getElementById('myTab').innerHTML = tabs;
            document.getElementById('myTabContent').innerHTML = tabContent;
        };
    
        // Llamar a la función para crear las pestañas
        createTabs();
    </script>
    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/control/controlCampus.js"></script>
    <script src="js/control/controlBecas.js"></script>
    <script src="js/control/controlBeneficios.js"></script>
    <script src="js/control/controlPlanes.js"></script>
    <script src="js/control/controlApoyos.js"></script>
    <script src="js/control/controlInteres.js"></script>
    <script src="js/control/controlCostos.js"></script>
    <script src="js/control/controlFormato.js"></script>
    <script src="js/control/controlFormatoAsociado.js"></script>
    <script src="js/control/controlMaterias.js"></script>
    <script src="js/control/controlCertificados.js"></script>
    <script src="js/control/controlIngles.js"></script>
    <script src="js/control/controlSemanas.js"></script>
    <script src="js/control/controlPeriodo.js"></script>
    <script src="js/control/controlSeguros.js"></script>
</body>

</script>

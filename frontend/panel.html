<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/panel.css">
</head>

<body>

    <section class="header">
        <div class="container py-3">
            <div class="row">
                <div class="col-12 d-flex justify-content-between">
                    <img src="https://universidad.tecmilenio.mx/hubfs/calculadora-ago24/tecmilenio-logo.svg">
                    <div>
                        <!-- <button class="btn btn-secondary" data-toggle="modal"
                            data-target="#registerModal">Registrarse</button> -->
                        <button id="logoutButton" class="btn btn-danger">Cerrar Sesión</button>
                        <!-- Modal para el registro -->
                        <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel"
                            aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="registerModalLabel">Registro de Usuario</h5>
                                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                            <span aria-hidden="true">&times;</span>
                                        </button>
                                    </div>
                                    <div class="modal-body">
                                        <form id="registerForm">
                                            <div class="form-group">
                                                <label for="register_usuario">Usuario</label>
                                                <input type="text" class="form-control" id="register_usuario"
                                                    name="register_usuario" required>
                                            </div>
                                            <div class="form-group">
                                                <label for="register_contrasena">Contraseña</label>
                                                <input type="password" class="form-control" id="register_contrasena"
                                                    name="register_contrasena" required>
                                            </div>
                                            <button type="submit" class="btn btn-primary">Registrarse</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section>
        <div class="container mt-4">
            <div class="row">

                <div class="col-12">
                    <ul class="nav nav-tabs align-middle" id="myTab" role="tablist"></ul>
                    <div class="tab-content" id="myTabContent"></div>
                </div>
            </div>
        </div>
    </section>


    <script type="module">
        import { niveles } from './js/control/tabs.js';

        const createForm = (nivel, pestaña, fields) => {

            return `
            
            <div id="${pestaña.nombre.toLowerCase()}Nivel${nivel.id}"></div>
                <form id="create${pestaña.nombre}Nivel${nivel.id}Form">

                ${fields.map(field => `
                <input type="text" class="form-control" id="${pestaña.nombre.toLowerCase()}Nivel${nivel.id}${field.id}" placeholder="${field.placeholder}" required>`).join('')}
                    <button type="submit" class="btn btn-success">Crear ${pestaña.nombre}</button>
                </form>
            `;
        };


        const createTabContent = (nivel, pestaña) => {
            const fieldsMap = {
                'campus': [
                    { id: 'Name', placeholder: 'Nombre del Campus' },
                    { id: 'Category', placeholder: 'Categoría del Campus' }
                ],
                'programas': [
                    { id: 'Name', placeholder: 'Nombre del Programa' },
                    { id: 'Type', placeholder: 'Tipo de Programa' }
                ],
                'periodo': [
                    { id: 'Name', placeholder: 'Periodo' },
                    { id: 'Type', placeholder: 'Código' }
                ],
                'seguros': [
                    { id: 'Accidentes', placeholder: 'Seguro Accidentes' },
                    { id: 'Cobertura', placeholder: 'Cobertura VIVE' },
                    { id: 'Estudiantil', placeholder: 'Seguro Estudiantil' }
                ],
                'becas': [
                    { id: 'Tipo', placeholder: 'Tipo de Beca' },
                    { id: 'PorcMinimo', placeholder: 'Porcentaje Mínimo' },
                    { id: 'PorcMaximo', placeholder: 'Porcentaje Máximo' },
                    { id: 'PromMinimo', placeholder: 'Promedio Mínimo' },
                    { id: 'PromMaximo', placeholder: 'Promedio Máximo' }
                ],
                'apoyos': [
                    { id: 'Porcentaje', placeholder: 'Porcentaje de Apoyo Estudiantil' }
                ],
                'apoyos-fijos': [
                    { id: 'Valor', placeholder: 'Valor de Apoyo Estudiantil' }
                ],
                'prestamos': [
                    { id: 'Porcentaje', placeholder: 'Porcentaje Prestamo Educativo' }
                ],
                'interes': [
                    { id: 'Porcentaje', placeholder: 'Porcentaje de Interés' }
                ],
                'carga-materias': [
                    { id: 'Materias', placeholder: 'Número de materias' }
                ],
                'certificados': [
                    { id: 'Certificados', placeholder: 'Número de certificados' }
                ],
                'ingles': [
                    { id: 'Ingles', placeholder: 'Número de cursos de inglés' }
                ],
                'semanas': [
                    { id: 'Semanas', placeholder: 'Número de semanas SEDI' }
                ],
                'carga-creditos': [
                    { id: 'Creditos', placeholder: 'Número de créditos' }
                ],
                'costo-materias': [
                    { id: 'Clave', placeholder: 'Clave' },
                    { id: 'Costo', placeholder: 'Costo' }
                ],
                'beneficios': [
                    { id: 'Nombre', placeholder: 'Nombre del beneficio' },
                    { id: 'Descripcion', placeholder: 'Descripción del beneficio' },
                    { id: 'Icono', placeholder: 'Link del icono' }
                ],
                'formato': [
                    { id: 'Formato', placeholder: 'Formato' },
                    { id: 'Codigo', placeholder: 'Código' }
                ],
                'formato_asociado': [
                    { id: 'Formato', placeholder: 'Formato Asociado' },
                    { id: 'Costo', placeholder: 'Costo' }
                ]
            };


            const fields = fieldsMap[pestaña.id];
            if (!fields) return ''; // Si no hay campos para esta pestaña, retorna vacío.

            return `
            <div class="tab-pane fade ${pestaña.id === 'campus' ? 'show active' : ''}" id="${pestaña.id}-${nivel.id}" role="tabpanel">
                ${createForm(nivel, pestaña, fields)}
            </div>`;
        };


        const createTabs = () => {
            let tabs = '';
            let tabContent = '';

            niveles.forEach((nivel, nivelIndex) => {
                // Crear la pestaña del nivel (tab principal)
                tabs += `
        <li class="nav-item">
            <a class="nav-link ${nivelIndex === 0 ? 'active' : ''}" id="${nivel.id}-tab" data-toggle="tab"
                href="#nivel-${nivel.id}" role="tab" aria-controls="nivel-${nivel.id}">${nivel.nombre}</a>
        </li>`;

                // Crear el contenedor del nivel y los tabs secundarios
                tabContent += `
        <div class="tab-pane fade ${nivelIndex === 0 ? 'show active' : ''}" id="nivel-${nivel.id}" role="tabpanel"
            aria-labelledby="${nivel.id}-tab">
            <ul class="nav nav-pills mb-3" id="pills-tab-${nivel.id}" role="tablist">
                ${nivel.pestañas.map((pestaña, pestañaIndex) => `
                <li class="nav-item">
                    <a class="nav-link ${pestañaIndex === 0 ? 'active' : ''}" id="${pestaña.id}-${nivel.id}-tab"
                        data-toggle="pill" href="#${pestaña.id}-${nivel.id}" role="tab"
                        aria-controls="${pestaña.id}-${nivel.id}">
                        ${pestaña.nombre}
                    </a>
                </li>`).join('')}
            </ul>
            <div class="tab-content" id="pills-tabContent-${nivel.id}">
                ${nivel.pestañas.map((pestaña, pestañaIndex) => createTabContent(nivel, pestaña)).join('')}
            </div>
        </div>`;
            });

            document.getElementById('myTab').innerHTML = tabs;
            document.getElementById('myTabContent').innerHTML = tabContent;
        };

        // Llamar a la función para crear las pestañas
        createTabs();
    </script>

    <script>
        // Función para verificar si el usuario tiene una sesión activa
        function checkSession() {
            const token = localStorage.getItem('token');
            if (!token) {
                // Si no hay token, redirigir al login
                window.location.href = 'login.html';
            }
        }

        // Llamar a la función de verificación de sesión cuando se carga la página
        checkSession();

        // Función de cierre de sesión
        document.getElementById('logoutButton').addEventListener('click', () => {
            console.log('Cerrando sesión');
            
            // Eliminar el token de la sesión
            localStorage.removeItem('token');
            // Redirigir al login
            window.location.href = 'login.html';
        });
    </script>

    <script>
        // Manejar el formulario de registro
        document.getElementById('registerForm').addEventListener('submit', async (event) => {
            event.preventDefault(); // Previene el envío del formulario

            const username = document.getElementById('register_usuario').value;
            const password = document.getElementById('register_contrasena').value;

            try {
                const response = await fetch('https://tecmilenio-calculadora-backend.testingbo.com/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user: username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Registro exitoso');
                    $('#registerModal').modal('hide'); // Cerrar el modal después del registro
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Hubo un problema con la solicitud');
            }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/control/controlCampus.js"></script>
    <script src="js/control/controlBecas.js"></script>
    <script src="js/control/controlBeneficios.js"></script>
    <script src="js/control/controlPlanes.js"></script>
    <script src="js/control/controlApoyos.js"></script>
    <script src="js/control/controlApoyosFijos.js"></script>
    <script src="js/control/controlCreditos.js"></script>
    <script src="js/control/controlPrestamos.js"></script>
    <script src="js/control/controlInteres.js"></script>
    <script src="js/control/controlCostos.js"></script>
    <script src="js/control/controlFormato.js"></script>
    <script src="js/control/controlFormatoAsociado.js"></script>
    <script src="js/control/controlMaterias.js"></script>
    <script src="js/control/controlCertificados.js"></script>
    <script src="js/control/controlIngles.js"></script>
    <script src="js/control/controlSemanas.js"></script>
    <script src="js/control/controlPeriodo.js"></script>
    <script src="js/control/controlSeguros.js"></script>


    </script>

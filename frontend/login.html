<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <section class="header">
        <div class="container py-3">
            <div class="row">
                <div class="col-12">
                    <img src="https://universidad.tecmilenio.mx/hubfs/calculadora-ago24/tecmilenio-logo.svg">
                </div>
            </div>
        </div>
    </section>

    <div class="container">
        <h2 class="mt-5">CALCULADORA DE BECAS</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="nombre_usuario">Usuario</label>
                <input type="text" class="form-control" id="nombre_usuario" name="nombre_usuario" required>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" name="contrasena" required>
            </div>
            <button type="submit" class="btn btn-primary">Ingresar</button>
        </form>
        
    </div>

    <!-- Modal para el registro -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">Registro de Usuario</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="register_usuario">Usuario</label>
                            <input type="text" class="form-control" id="register_usuario" name="register_usuario"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="register_contrasena">Contraseña</label>
                            <input type="password" class="form-control" id="register_contrasena"
                                name="register_contrasena" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Registrarse</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script type="module">
        import { API_BASE_URL } from './js/apiConfig.js';
        
        // Manejar el formulario de inicio de sesión
        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault(); // Previene el envío del formulario

            const username = document.getElementById('nombre_usuario').value;
            const password = document.getElementById('contrasena').value;

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user: username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'panel.html';
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Hubo un problema con la solicitud');
            }
        });

        
    </script>
</body>

</html>

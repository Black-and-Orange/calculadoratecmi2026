<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2 class="mt-5">Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="nombre_usuario">Usuario</label>
                <input type="text" class="form-control" id="nombre_usuario" name="nombre_usuario" required>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" name="contrasena" required>
            </div>
            <button type="submit" class="btn btn-primary">Ingresar</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault(); // Previene el envío del formulario

            const username = document.getElementById('nombre_usuario').value;
            const password = document.getElementById('contrasena').value;
            

            try {
                const response = await fetch('http://localhost:3008/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user: username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Maneja el éxito, por ejemplo, guardando el token en localStorage
                    localStorage.setItem('token', data.token);
                    alert('Inicio de sesión exitoso');
                    // Redirige o realiza alguna acción adicional
                    window.location.href = 'panel.html'; // Redirige a una página protegida
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Hubo un problema con la solicitud');
            }
        });
    </script>
</body>
</html>
